services:
  app-prod:
    build:
      context: ../../..
      dockerfile: docker/local/Dockerfile
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - DOCKER_API_PORT=${DOCKER_API_PORT:-8080}
      - DOCKER_LIMITS_CPUS=${DOCKER_LIMITS_CPUS:-0.5}
      - DOCKER_LIMITS_MEMORY=${DOCKER_LIMITS_MEMORY:-256M}
      - DOCKER_NETWORK=${DOCKER_NETWORK:-enviame-gce-proxies}
      - FIRESTORE_EMULATOR_HOST=firestore-prod:${DOCKER_FIRESTORE_EMULATOR_PORT:-8200}
      - FIRESTORE_PROJECT_ID=${PROJECT_ID:-zitio}
    ports:
      - "${DOCKER_HOST_PORT:?DOCKER_HOST_PORT environment variable is required}:${DOCKER_API_PORT:-8080}"
    volumes:
      - ../../../:/app/
    command: python -m debugpy --listen 0.0.0.0:5678 -m gunicorn --bind :8080 --workers 1 --timeout 500 src.main:app --reload
    depends_on:
      firestore-prod:
        condition: service_started

  firestore-prod:
    image: mtlynch/firestore-emulator
    environment:
      - FIRESTORE_PROJECT_ID=${PROJECT_ID:-zitio}
      - PORT=${DOCKER_FIRESTORE_EMULATOR_PORT:-8200}
    ports:
      - "${DOCKER_FIRESTORE_EMULATOR_HOST_PORT:?DOCKER_FIRESTORE_EMULATOR_HOST_PORT environment variable is required}:${DOCKER_FIRESTORE_EMULATOR_PORT:-8200}"
