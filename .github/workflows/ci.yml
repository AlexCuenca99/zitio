name: ci
on:
  pull_request:
    branches:
      - stage
      - master

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Bandit
        run: bandit -c pyproject.toml -r src

      - name: Detect secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      firestore:
        image: mtlynch/firestore-emulator
        env:
          FIRESTORE_PROJECT_ID: zitio-test
          PORT: 8200
        ports:
          - 8200:8200
    env:
      FIRESTORE_EMULATOR_HOST: localhost:8200
      PROJECT_ID: zitio-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The emulator image has no healthcheck; wait until it answers.
      - name: Wait for the Firestore emulator
        run: |
          for _ in $(seq 1 30); do
            curl -s localhost:8200 > /dev/null && exit 0
            sleep 2
          done
          echo "Firestore emulator did not start" && exit 1

      - name: Pytest
        run: pytest --cov=src --cov-report=term
